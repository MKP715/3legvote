name: Test and build

# GitHub Pages serves the main branch root ("Deploy from a branch"), so the built site is
# committed. This workflow runs the tests and checks that the committed build matches src/.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: The published site must be committed and up to date
        run: |
          test -f index.html
          test -f .nojekyll
          ls assets/*.js >/dev/null
          if ! git diff --quiet -- index.html assets manifest.webmanifest .published.json; then
            echo "::error::The built site at the repository root is out of date."
            echo "Run 'npm run build' and commit the regenerated files."
            git diff --stat -- index.html assets manifest.webmanifest .published.json
            exit 1
          fi
